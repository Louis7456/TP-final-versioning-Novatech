<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact | Novatech</title>
</head>
<body>
    <header>
        <h1><span style="color: green;">Nova</span>tech</h1>
        <nav>
            <a href="Index.html">Accueil</a>
            <a href="Index.html">Présentation de l'entreprise</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
            <a href="Index.html">Mentions légales</a>
        </nav>
    </header>

    <main class="contact-page">
        <section class="contact-container">
            <div class="section-title">
                <h2>Contactez-nous</h2>
                <p>Nous sommes à votre disposition pour répondre à vos demandes.</p>
            </div>

            <form class="contact-form">
                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="votre.email@example.com" required>
                </div>

                <div class="form-group">
                    <label for="sujet">Sujet</label>
                    <input type="text" id="sujet" name="sujet" placeholder="Objet de votre message" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Votre message..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Envoyer</button>
            </form>
        </section>
    </main>
</body>
</html>
